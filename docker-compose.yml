name: statushub

# Local stand-ins for AWS services: nothing here touches a real AWS account.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324" # SQS API
      - "9325:9325" # web UI

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP
      - "${MAILHOG_UI_PORT:-8026}:8025" # web UI (8026 by default: 8025 is often taken)
