name: Deploy

# push on main -> build ONCE -> dev (automatic) -> prod (manual approval on the "production" environment)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build:
    name: Build artifacts (once)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests before packaging
        run: dotnet test backend/StatusHub.sln -c Release
      - name: Lambda zips (Checker built as Native AOT in an Amazon Linux 2023 container)
        run: scripts/package-lambdas.sh
        env:
          GITHUB_SHA: ${{ github.sha }}
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm test -- --watch=false
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ github.sha }}
          path: build/lambda
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/statushub-web/browser
          retention-days: 30
          if-no-files-found: error

  dev:
    name: Deploy dev
    needs: build
    # Stays green until the AWS settings exist (repository variable AWS_ROLE_ARN, see docs/ci-cd.md)
    if: vars.AWS_ROLE_ARN != ''
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      terraform_dir: infra/envs/dev
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  prod:
    name: Deploy prod (manual approval)
    needs: dev
    if: vars.AWS_ROLE_ARN != ''
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: production # GitHub environment with required reviewers
      terraform_dir: infra/envs/prod
    permissions:
      contents: read
      id-token: write
    secrets: inherit
