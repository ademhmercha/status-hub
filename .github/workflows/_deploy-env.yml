name: Deploy one environment

# Reusable. Deploys the artifacts built by deploy.yml (same files for dev and prod: build once, deploy many).
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment (dev or production). Variables and approvals come from it.
        required: true
        type: string
      terraform_dir:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_profile: ""
      TF_VAR_sender_email: ${{ vars.SENDER_EMAIL }}
      TF_VAR_enable_ses: ${{ vars.ENABLE_SES || 'true' }}
      TF_VAR_enable_xray: ${{ vars.ENABLE_XRAY || 'true' }}
      TF_VAR_enable_pitr: ${{ vars.ENABLE_PITR || 'false' }}
      TF_VAR_enable_cloudfront: ${{ vars.ENABLE_CLOUDFRONT || 'true' }}
      TF_VAR_enable_observability: ${{ vars.ENABLE_OBSERVABILITY || 'true' }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_enable_google: ${{ vars.ENABLE_GOOGLE || 'false' }}
      TF_VAR_google_client_id: ${{ vars.GOOGLE_CLIENT_ID }}
      TF_VAR_google_client_secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    outputs:
      api_endpoint: ${{ steps.out.outputs.api_endpoint }}
      frontend_url: ${{ steps.out.outputs.frontend_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lambda-${{ github.sha }}
          path: build/lambda
      - uses: actions/download-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend-dist

      - name: AWS credentials (OIDC, no stored key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-north-1
          role-session-name: gha-${{ inputs.environment }}-${{ github.run_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.10"
          terraform_wrapper: false

      - name: terraform apply
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="region=eu-north-1"
          terraform apply -input=false -auto-approve -var "artifacts_dir=$GITHUB_WORKSPACE/build/lambda"

      - name: Read outputs
        id: out
        working-directory: ${{ inputs.terraform_dir }}
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"
          echo "web_bucket=$(terraform output -raw web_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      - name: Deploy the frontend (S3 + CloudFront invalidation)
        if: steps.out.outputs.web_bucket != ''
        run: |
          B="${{ steps.out.outputs.web_bucket }}"
          # config.json is generated by Terraform: never delete or overwrite it from the build.
          aws s3 sync frontend-dist "s3://$B" --delete --exclude "config.json" --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp frontend-dist/index.html "s3://$B/index.html" --cache-control "no-cache" --content-type "text/html"
          aws cloudfront create-invalidation --distribution-id "${{ steps.out.outputs.distribution_id }}" --paths "/index.html" "/config.json" >/dev/null

      - name: Smoke test
        run: scripts/smoke-test.sh "${{ steps.out.outputs.api_endpoint }}" "${{ steps.out.outputs.frontend_url }}"

      - name: Summary
        run: |
          {
            echo "### ${{ inputs.environment }} deployed (${GITHUB_SHA::7})"
            echo "- API: ${{ steps.out.outputs.api_endpoint }}"
            echo "- Frontend: ${{ steps.out.outputs.frontend_url }}"
            echo "- Rollback: run the **Rollback** workflow, or \`aws lambda update-alias --name live\`."
          } >> "$GITHUB_STEP_SUMMARY"
